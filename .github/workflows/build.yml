name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Clone project
        uses: actions/checkout@v7

      - name: Install JDK
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          check-latest: true

      - name: Restore upstream inputs
        run: |
          git clone https://hub.spigotmc.org/stash/scm/spigot/builddata.git Paper/work/BuildData
          git clone https://hub.spigotmc.org/stash/scm/spigot/bukkit.git Paper/work/Bukkit
          git clone https://hub.spigotmc.org/stash/scm/spigot/craftbukkit.git Paper/work/CraftBukkit
          git clone https://hub.spigotmc.org/stash/scm/spigot/spigot.git Paper/work/Spigot
          git clone https://github.com/PaperMC/Paperclip.git Paper/work/Paperclip
          git -C Paper/work/BuildData checkout --detach f0a5ed1aeff8156ba4afa504e190c838dd1af50c
          git -C Paper/work/Bukkit checkout --detach 7e29f7654411f0a17ebbcc2c3f6a7dfe93bff39e
          git -C Paper/work/CraftBukkit checkout --detach 296df56673771692593156995684ab8041925d9d
          git -C Paper/work/Spigot checkout --detach 9fb885e86def1d9d86e25233c9b5a4de45b7a09d
          git -C Paper/work/Paperclip fetch --depth=1 origin 6776c66987a021a1c0db55b2e21c883660acc19f
          git -C Paper/work/Paperclip checkout --detach FETCH_HEAD

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          
      - name: Build
        run: |
          chmod +x gradlew Paper/paper Paper/scripts/*.sh
          ./gradlew applyPatches --stacktrace --no-daemon
          ./gradlew paperclip -x javadoc -x javadocJar --stacktrace --no-daemon

      - name: Upload final JAR
        uses: actions/upload-artifact@7 # v7.0.1
        with:
          path: purpur-paperclip.jar
          archive: false
          if-no-files-found: error
          retention-days: 14
